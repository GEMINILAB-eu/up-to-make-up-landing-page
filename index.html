<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Up To MakeUp</title>
  <meta name="description" content="Up To MakeUp — Esplora, impara e valorizza la tua bellezza ogni giorno. Scarica l'app per iPhone e Android.">
  <meta name="theme-color" content="#0B0B0C">
  <meta property="og:title" content="Up To MakeUp">
  <meta property="og:description" content="Esplora, impara e valorizza la tua bellezza ogni giorno.">
  <meta property="og:image" content="assets/logo.jpg">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <style>
    :root {
      --bg: #0B0B0C;
      --burgundy-deep: #3D0E1C;
      --primary: #DF5173;
      --primary-dark: #B83655;
      --text: #FFFFFF;
      --text-secondary: #D3BCC4;
      --text-muted: #856A74;
      --border: #35202A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Lo sfondo base sta su html: copre anche l'overscroll e la zona sotto la barra di Safari */
    html { background: var(--bg); }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px calc(32px + env(safe-area-inset-bottom));
      /* Gradienti dimensionati sul body (che cresce col contenuto) e non ripetuti */
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 90% 60% at 50% 0%, var(--burgundy-deep) 0%, transparent 70%),
        radial-gradient(circle at 50% 38%, rgba(223, 81, 115, 0.12) 0%, transparent 45%);
      background-repeat: no-repeat;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      justify-content: center;
    }

    .logo {
      width: min(340px, 82vw);
      height: auto;
      /* Il nero del logo si fonde con lo sfondo della pagina */
      mix-blend-mode: lighten;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(30px, 7vw, 40px);
      font-weight: 800;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
    }

    .subtitle {
      font-size: clamp(16px, 4.2vw, 19px);
      line-height: 1.55;
      color: var(--text-secondary);
      margin-bottom: 44px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
      padding: 12px 22px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      text-align: left;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }

    .btn svg { width: 28px; height: 28px; flex-shrink: 0; fill: currentColor; }

    .btn small {
      display: block;
      font-size: 12px;
      opacity: 0.85;
      line-height: 1.2;
    }

    .btn strong {
      display: block;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 6px 18px rgba(223, 81, 115, 0.35);
    }
    .btn-primary:hover { box-shadow: 0 10px 26px rgba(223, 81, 115, 0.45); }

    .btn-outline {
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--primary); }

    footer {
      margin-top: 48px;
      font-size: 13px;
      color: var(--text-muted);
    }

    @media (max-width: 520px) {
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/logo.jpg" alt="Up To MakeUp" width="960" height="480">

    <h1>Up To MakeUp</h1>
    <p class="subtitle">Esplora, impara e valorizza<br>la tua bellezza ogni giorno.</p>

    <div class="buttons">
      <a class="btn btn-primary" href="https://apps.apple.com/it/app/uptomakeup/id6830670927" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.6c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.48.83-.72 0-1.82-.81-3-.79-1.54.02-2.96.9-3.76 2.28-1.6 2.78-.41 6.9 1.15 9.16.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.78.74 2.99.72 1.24-.02 2.02-1.12 2.77-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.4-.92-2.42-3.66zM14.1 5.84c.63-.77 1.06-1.83.94-2.89-.91.04-2.02.61-2.67 1.37-.58.67-1.1 1.76-.96 2.8 1.02.08 2.06-.52 2.69-1.28z"/></svg>
        <span><small>Scarica su</small><strong>App Store</strong></span>
      </a>

      <a class="btn btn-outline" href="UpToMakeUp.apk" download="UpToMakeUp.apk" type="application/vnd.android.package-archive">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.6 9.48l1.84-3.18a.38.38 0 0 0-.66-.38l-1.86 3.22a11.4 11.4 0 0 0-9.84 0L5.22 5.92a.38.38 0 0 0-.66.38L6.4 9.48A10.8 10.8 0 0 0 1 18h22a10.8 10.8 0 0 0-5.4-8.52zM7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/></svg>
        <span><small>Scarica per Android</small><strong>APK</strong></span>
      </a>
    </div>
  </main>

  <footer>© 2026 Up To MakeUp · GEMINILAB</footer>
</body>
</html>
